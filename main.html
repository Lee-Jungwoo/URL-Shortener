<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Shortener</title>
</head>
<body>
    <h1>Link Shortener</h1>
    <form id="urlForm">
        <input type="text" id="originalUrl" placeholder="your original url..." required>
        <button type="submit">Shorten URL</button>
    </form>

    <script>
        $('#urlForm').submit(function(event) {
            event.preventDefault();
            const originalUrl = $('#originalUrl').val();

            $.ajax({
            url: 'http://localhost:5000/api/shorten',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ url: originalUrl }),
            success: function(data) {
                console.log('Shortened URL:', data.shortenedUrl);
            },
            error: function(error) {
                console.error('Error:', error);
            }
            });
        });
    </script>
</body>
</html></html>
