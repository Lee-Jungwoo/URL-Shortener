<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container text-center">
      <div class="row row-cols-1">
        <div>
            <h1>Simple URL Shortener</h1>
        </div>
        <div class="mb-3">
            <input type="text" id="url" class="form-control" placeholder="Enter URL" required />
        </div>
        <div class="mb-3">
            <button type="button" class="btn btn-primary" onclick="shortenURL()">Shorten</button>
        </div>
        <div class="mt-3">
            <p id="result"></p>
        </div>
      </div>
    </div>
    <script>
      function shortenURL() {
        const url = document.getElementById("url").value;
        if (!url) {
          alert("Please enter a URL");
          return;
        }
        fetch("http://localhost:5000/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.shortened) {
              document.getElementById(
                "result"
              ).innerHTML = `Shortened URL: <a href="${data.shortened}" target="_blank">${data.shortened}</a>`;
            } else {
              alert("Error shortening URL");
            }
          });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
  </body>
</html>
