<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkShorty</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="style.css"/>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container text-center">
      <div class="row row-cols-1">
        <div>
            <h1>LinkShorty</h1>
            <h3>Simple URL Shortener</h3>
        </div>
        <div class="mb-3">
            <input type="text" id="url" class="form-control" placeholder="Enter URL" required/>
            <input type="text" id="custom-key" class="form-control" placeholder="Enter Custom Tag (less than 30 characters)" style="display: none;"/>
        </div>
        <div class="mb-3">
            <button type="button" class="btn btn-primary" onclick="shortenURL()">Shorten</button>
            <button type="button" class="btn btn-primary" onclick="toggleCustom()">Shorten (with Custom Tag)</button>
            <button type="button" class="btn btn-info" onclick="unshortenURL()">Unshorten</button>
        </div>
        <div class="mt-3" id = "url-block" style="display: none;">
            <p id="result"></p>
            <button type="button" class="btn btn-light" id="copy-button" onclick="toggleCopy()">Copy</button>
        </div>
      </div>
    </div>
    <script src="./conf/conf.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
  </body>
</html>
