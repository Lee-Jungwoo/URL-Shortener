<html>
  <head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B600%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/x-icon" />
    <title>LinkShorty - Your Link is Ready!</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      .hover-scale {
        transition: transform 0.2s ease-in-out;
      }
      .hover-scale:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body class="bg-slate-50" style="font-family: Inter, 'Noto Sans', sans-serif">
    <div
      class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden"
    >
      <div class="layout-container flex h-full grow flex-col">
        <header
          class="flex items-center justify-between whitespace-nowrap px-10 py-6"
        >
          <div class="flex items-center gap-3 text-slate-900">
            <img src="{{url_for('static', filename='favicon.png')}}" class="w-8 h-8"/>
            <h2
              class="text-slate-900 text-xl font-bold leading-tight tracking-tight"
            >
              LinkShorty
            </h2>
          </div>
          <nav class="flex items-center gap-6 text-slate-700">
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Home</a
            >
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Pricing</a
            >
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Features</a
            >
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Contact</a
            >
          </nav>
          <div class="flex items-center gap-3">
            <button
              class="flex min-w-[90px] items-center justify-center rounded-lg h-10 px-5 bg-transparent text-slate-700 text-sm font-semibold hover:bg-slate-100 transition-colors"
            >
              <span>Log In</span>
            </button>
            <button
              class="flex min-w-[90px] items-center justify-center rounded-lg h-10 px-5 bg-[#0A74DA] text-white text-sm font-semibold hover:bg-[#0968C3] transition-colors shadow-sm"
            >
              <span>Sign Up</span>
            </button>
          </div>
        </header>
        <main class="flex flex-1 justify-center py-12 px-6 sm:px-10">
          <div class="w-full max-w-xl space-y-8">
            <div class="text-center">
              <h1 class="text-slate-900 text-4xl font-bold tracking-tight">
                Your link is ready!
              </h1>
              <p class="text-slate-600 text-lg mt-2">
                Share your shortened link far and wide.
              </p>
            </div>
            <div class="bg-white p-8 rounded-xl shadow-xl">
              <label
                class="block text-sm font-medium text-slate-700 mb-1"
                for="shortened-url"
                >Your Shortened URL</label
              >
              <div
                class="flex items-center rounded-lg border border-slate-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all mb-4"
              >
                <input
                  class="form-input flex-grow appearance-none bg-transparent border-0 rounded-l-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-0 h-12 px-4 text-base"
                  id="shortened-url"
                  readonly=""
                  type="text"
                  value="{{short_url}}"
                />
                <button
                  aria-label="Copy to clipboard"
                  class="flex items-center justify-center px-4 h-12 text-slate-500 hover:text-blue-600 border-l border-slate-300 transition-colors"
                  onclick="copyToClipboard()"
                  type="button"
                >
                  <svg
                    fill="currentColor"
                    height="20px"
                    viewBox="0 0 256 256"
                    width="20px"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"
                    ></path>
                  </svg>
                </button>
              </div>
              
              
             
            </div>
            <div class="text-center text-sm text-slate-500">
              <p>
                Need to create another link?
                <a
                  class="font-medium text-blue-600 hover:text-blue-500"
                  href="#"
                  >Go back to homepage</a
                >.
              </p>
            </div>
          </div>
        </main>
        <footer
          class="py-8 px-10 text-center border-t border-slate-200 bg-white"
        >
          <p class="text-sm text-slate-500">
            © 2025 ShortLink. All rights reserved.
          </p>
        </footer>
      </div>
    </div>
    <script>
      function copyToClipboard() {
        const inputElement = document.getElementById("shortened-url");
        const copyStatusElement = document.getElementById("copy-status");
        if (navigator.clipboard && inputElement) {
          navigator.clipboard
            .writeText(inputElement.value)
            .then(() => {
              copyStatusElement.textContent = "Copied to clipboard!";
              setTimeout(() => {
                copyStatusElement.textContent = "";
              }, 2000);
            })
            .catch((err) => {
              copyStatusElement.textContent = "Failed to copy!";
              console.error("Failed to copy text: ", err);
              setTimeout(() => {
                copyStatusElement.textContent = "";
              }, 2000);
            });
        } else {
          // Fallback for older browsers
          inputElement.select();
          document.execCommand("copy");
          copyStatusElement.textContent = "Copied to clipboard! (fallback)";
          setTimeout(() => {
            copyStatusElement.textContent = "";
          }, 2000);
        }
      }


    </script>
  </body>
</html>
