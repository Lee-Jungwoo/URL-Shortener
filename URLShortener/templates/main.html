<html>
  <head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B600%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
      onload="this.rel='stylesheet'"
      rel="stylesheet"
    />
    <link rel="icon" href="{{url_for('static', filename='favicon.png')}}" type="image/x-icon" />
    <title>LinkShorty - URL Shortener</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      .gradient-bg {
        background: linear-gradient(180deg, #ffffff 0%, #ebf2fa 100%);
      }
      
      /* Custom key input animation */
      .custom-key-container {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
      }
      
      .custom-key-container.show {
        max-height: 90px;
        /* margin-top: 1rem; */
      }
      
      .url-input-wrapper {
        position: relative;
      }
    </style>
  </head>
  <body class="gradient-bg">
    <div
      class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden"
      style="font-family: Inter, 'Noto Sans', sans-serif"
    >
      <div class="layout-container flex h-full grow flex-col">
        <header
          class="flex items-center justify-between whitespace-nowrap px-10 py-6"
        >
          <div class="flex items-center gap-3 text-slate-900">
            <img src="{{url_for('static', filename='favicon.png')}}" type="image/x-icon" class="w-8 h-8"/>
            <h2
              class="text-slate-900 text-xl font-bold leading-tight tracking-tight"
            >
              LinkShorty
            </h2>
          </div>
          <nav class="flex items-center gap-6 text-slate-700">
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Home</a
            >
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Pricing</a
            >
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Features</a
            >
            <a
              class="text-sm font-medium hover:text-[#0A74DA] transition-colors"
              href="#"
              >Contact</a
            >
          </nav>
          <div class="flex items-center gap-3">
            <button
              class="flex min-w-[90px] items-center justify-center rounded-lg h-10 px-5 bg-transparent text-slate-700 text-sm font-semibold hover:bg-slate-100 transition-colors"
            >
              <span>Log In</span>
            </button>
            <button
              class="flex min-w-[90px] items-center justify-center rounded-lg h-10 px-5 bg-[#0A74DA] text-white text-sm font-semibold hover:bg-[#0968C3] transition-colors shadow-sm"
            >
              <span>Sign Up</span>
            </button>
          </div>
        </header>
        <main
          class="flex flex-1 flex-col items-center justify-center py-12 px-4"
        >
          <div class="w-full max-w-2xl text-center">
            <h1 class="text-5xl font-bold tracking-tight text-slate-900 mb-6">
              Shorten Your Links, Expand Your Reach
            </h1>
            <p class="text-lg text-slate-600 mb-10">
              Create clean, memorable short URLs. Paste your long link below to
              get started.
            </p>




            <div class="flex flex-col sm:flex-row items-center gap-4 w-full url-input-wrapper">
              <label class="flex-1 w-full">
                <span class="sr-only">Paste a long URL</span>
                <input
                  class="form-input flex w-full resize-none overflow-hidden rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#0A74DA] border border-slate-300 bg-white h-16 placeholder:text-slate-400 p-5 text-base font-normal leading-normal shadow-sm"
                  placeholder="Paste your long URL here"
                  value=""
                  id="url"
                />
              </label>
              
              <!-- Custom key input container -->
              
              <label class="flex-1 w-full custom-key-container">
                <span class="sr-only">Enter a custom key</span>
                <input
                  class="form-input flex w-full resize-none overflow-hidden rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#0A74DA] border border-slate-300 bg-white h-16 placeholder:text-slate-400 p-5 text-base font-normal leading-normal shadow-sm"
                  placeholder="Enter Custom Key"
                  value=""
                  id="custom-key"
                />
              </label>
              
            </div>


            <div class="flex flex-col sm:flex-row items-center justify-center mt-6 w-full gap-4">
              <button
                  class="flex w-full sm:w-auto min-w-[120px] items-center justify-center rounded-xl h-16 px-8 bg-[#0A74DA] text-white text-lg font-semibold hover:bg-[#0968C3] transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-[#0A74DA] focus:ring-offset-2"
                  id="shorten"
                  >
                  <span class="truncate">Shorten</span>
              </button>
              <button
                  class="flex w-full sm:w-auto min-w-[120px] items-center justify-center rounded-xl h-16 px-8 bg-[#0A74DA] text-white text-lg font-semibold hover:bg-[#0968C3] transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-[#0A74DA] focus:ring-offset-2"
                  id="shorten-custom"
                  >
                  <span class="truncate">Use custom key</span>
              </button>
            </div>

            <div class="mt-8 text-sm text-slate-500">
              By using LinkShorty, you agree to our
              <a class="underline hover:text-[#0A74DA]" href="#"
                >Terms of Service</a
              >.
            </div>
          </div>
        </main>
        <footer
          class="px-10 py-8 text-center text-sm text-slate-500 border-t border-slate-200"
        >
          © 2025 LinkShorty. All rights reserved.
        </footer>
      </div>
    </div>
    <script src="{{url_for('static', filename='conf/conf.js')}}"></script>
    <script src="{{url_for('static', filename='script.js')}}"></script>
    <script>
      // Example JavaScript for handling the shorten button click
      document.getElementById('shorten').addEventListener('click', function() {
        const input = document.getElementById('url');
        const longUrl = input.value.trim();
        if (longUrl) {
          
          shortenURL();
          
          
        } else {
          alert('Please enter a valid URL.');
        }
      });

      document.getElementById('shorten-custom').addEventListener('click', function() {
        const customKeyContainer = document.querySelector('.custom-key-container');
        
        // If the custom key field is already visible, proceed with shortening
        if (customKeyContainer.classList.contains('show')) {
          const input = document.getElementById('url');
          const longUrl = input.value.trim();
          if (longUrl) {
            shortenURL(true); // Call with custom=true
          } else {
            alert('Please enter a valid URL.');
          }
        } else {
          // Show the custom key input field
          customKeyContainer.classList.add('show');
          setTimeout(function() {
            customKeyContainer.style.overflow = 'visible';
          }, 300);
        }
      });
    </script>
  </body>
</html>
